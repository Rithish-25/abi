name: abirami_laboratory
description: Abirami Laboratory - blood test booking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.3
  font_awesome_flutter: ^10.7.0
  pdf: ^3.11.3
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  firebase_core: ^2.30.0
  cloud_firestore: ^4.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
