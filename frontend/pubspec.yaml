name: abirami_laboratory
description: Abirami Laboratory - blood test booking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.3
  font_awesome_flutter: ^11.0.0
  pdf: ^3.11.3
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^19.5.0
  firebase_messaging: ^16.4.3
  crypto: ^3.0.3
  image_picker: ^1.1.2
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/.env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
